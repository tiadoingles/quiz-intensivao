<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Quiz — Intensivão Saia do Básico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Visual alinhado à Cademí: Inter, vermelho #f2133b, cinzas neutros, cartão claro sobre o fundo escuro da plataforma */
:root{--red:#f2133b;--red-d:#d00f31;--red-l:#fff1f3;--red-b:#fecdd6;--ink:#18181b;--txt:#3f3f46;--mut:#71717a;--line:#e4e4e7;--soft:#f4f4f5;--green:#16a34a;--green-l:#f0fdf4;--green-b:#bbf7d0;--white:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:transparent;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.wrap{max-width:none;margin:0;padding:0;}
.card{background:var(--white);border-radius:16px;padding:32px 20px;border:1px solid var(--line);}
.card>.screen{max-width:600px;margin:0 auto;}
@media(min-width:560px){.card{padding:44px 32px;}}
.screen{display:none;animation:fade .3s ease;}
.screen.on{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.badge{display:inline-flex;align-items:center;gap:6px;background:var(--red-l);color:var(--red);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;}
.hero{text-align:center;margin-bottom:28px;}
.hero .badge{margin-bottom:16px;}
.hero h1{font-size:clamp(26px,5.4vw,34px);font-weight:800;color:var(--ink);line-height:1.2;letter-spacing:-.02em;margin-bottom:10px;}
.hero h1 em{font-style:normal;color:var(--red);}
.hero p{color:var(--mut);font-size:15.5px;line-height:1.6;max-width:440px;margin:0 auto;}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 0;}
.pill{background:var(--soft);color:var(--txt);font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;text-align:center;}

.fg{margin-bottom:14px;}
.fg label{display:block;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.fg input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;color:var(--ink);outline:none;background:#fff;transition:border-color .2s,box-shadow .2s;}
.fg input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(242,19,59,.12);}
.fg input.bad{border-color:var(--red);background:var(--red-l);}
.err{color:var(--red-d);font-size:13.5px;font-weight:600;min-height:18px;margin:4px 0 8px;text-align:center;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:999px;font-size:15.5px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:transform .15s,background .2s,border-color .2s,opacity .2s;}
.btn:active{transform:scale(.98);}
.btn-p{background:var(--red);color:#fff;}
.btn-p:hover{background:var(--red-d);}
.btn-p:disabled{opacity:.35;cursor:not-allowed;}
.btn-o{background:#fff;color:var(--ink);border-color:var(--line);}
.btn-o:hover{border-color:var(--ink);}
.btn-g{background:transparent;color:var(--mut);padding:12px 8px;font-size:14.5px;}
.btn-g:hover{color:var(--ink);}
.btn-g:disabled{visibility:hidden;}
.full{width:100%;}

.prog{margin-bottom:26px;}
.prog-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-weight:500;margin-bottom:8px;}
.prog-meta b{color:var(--ink);font-weight:700;}
.bar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--red);border-radius:999px;transition:width .35s ease;}
.q-num{font-size:12.5px;font-weight:700;color:var(--red);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;}
.q-text{font-size:clamp(19px,4.4vw,22px);font-weight:700;color:var(--ink);line-height:1.4;letter-spacing:-.01em;margin-bottom:22px;}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:26px;}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;font-family:inherit;color:var(--ink);cursor:pointer;transition:all .15s;line-height:1.4;}
.opt:hover{border-color:#a1a1aa;background:#fafafa;}
.opt .l{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--txt);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;transition:all .15s;}
.opt.sel{border-color:var(--red);background:var(--red-l);box-shadow:0 0 0 1px var(--red) inset;}
.opt.sel .l{background:var(--red);color:#fff;}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;}

.loader{text-align:center;padding:48px 0;}
.spin{width:40px;height:40px;border:3px solid var(--soft);border-top-color:var(--red);border-radius:50%;margin:0 auto 16px;animation:sp .9s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.loader p{color:var(--mut);font-size:15px;}

.res-head{text-align:center;margin-bottom:26px;}
.res-head h2{font-size:clamp(24px,5vw,30px);font-weight:800;color:var(--ink);line-height:1.2;letter-spacing:-.02em;margin:14px 0 6px;}
.res-head h2 em{color:var(--red);font-style:normal;}
.res-head p{color:var(--mut);font-size:15px;line-height:1.6;}
.score{width:140px;height:140px;margin:18px auto 6px;position:relative;}
.score svg{width:100%;height:100%;transform:rotate(-90deg);}
.score .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score .n b{font-size:38px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.02em;}
.score .n span{font-size:12.5px;color:var(--mut);font-weight:500;margin-top:4px;}
.stats{display:flex;gap:8px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap;}
.stat{padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;text-align:center;}
.stat.ok{background:var(--green-l);color:var(--green);}
.stat.no{background:var(--red-l);color:var(--red-d);}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 28px;}
.actions .btn{font-size:15px;padding:13px 12px;}
.sec-t{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:12px;}
.rev{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;break-inside:avoid;page-break-inside:avoid;background:#fff;}
.rev.ok{border-color:var(--green-b);}
.rev.no{border-color:var(--red-b);}
.rev-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
.rev-ic{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;margin-top:1px;}
.rev.ok .rev-ic{background:var(--green);}
.rev.no .rev-ic{background:var(--red);}
.rev-q{font-size:15px;font-weight:600;color:var(--ink);line-height:1.45;}
.rev-a{font-size:14.5px;line-height:1.5;padding-left:34px;margin-top:6px;color:var(--txt);}
.rev-a small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:1px;}
.rev-a.right b{color:var(--green);font-weight:600;}
.rev-a.wrong b{color:var(--red-d);font-weight:600;text-decoration:line-through;text-decoration-thickness:1.5px;}
.rev-exp{margin:12px 0 0 34px;padding:12px 14px;background:var(--soft);border-radius:10px;font-size:14px;line-height:1.6;color:var(--txt);}
.rev-exp strong{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:3px;}
.who{font-size:13px;color:var(--mut);text-align:center;margin-top:6px;}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:10;max-width:calc(100% - 32px);text-align:center;}
.toast.on{opacity:1;transform:translateX(-50%);}
.pdf-only{display:none;}
.notfound{text-align:center;padding:20px 0;color:var(--mut);}
.notfound h1{font-size:24px;font-weight:800;color:var(--ink);margin:14px 0 8px;}

@media print{
  .actions,.toast,.no-print{display:none!important;}
  .card{border:0;padding:0;}
  .pdf-only{display:block;}
}
/* modo PDF (html2pdf): mesma aparência da impressão */
.pdf-mode .actions,.pdf-mode .no-print{display:none!important;}
.pdf-mode .pdf-only{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">

    <!-- Capa -->
    <section class="screen on" id="s-start">
      <noscript><p class="err" style="margin-bottom:14px">Para responder o quiz, ative o JavaScript ou abra em: tiadoingles.github.io/quiz-intensivao</p></noscript>
      <div class="hero">
        <span class="badge" id="h-badge">Quiz</span>
        <h1 id="h-title">Intensivão <em>Saia do Básico</em></h1>
        <p>Responda com calma, uma pergunta por vez. No final você vê sua nota e a correção completa.</p>
        <div class="pills"><span class="pill" id="h-count">10 perguntas</span><span class="pill">≈ 5 minutos</span></div>
      </div>
      <form id="f-start" novalidate>
        <div class="fg"><label for="i-nome">Nome completo</label><input id="i-nome" autocomplete="name" placeholder="Seu nome"></div>
        <div class="fg"><label for="i-email">E-mail</label><input id="i-email" type="email" autocomplete="email" inputmode="email" placeholder="seuemail@exemplo.com"></div>
        <div class="fg"><label for="i-whats">WhatsApp</label><input id="i-whats" type="tel" autocomplete="tel" inputmode="tel" placeholder="(11) 91234-5678"></div>
        <div class="err" id="e-start"></div>
        <button class="btn btn-p full" type="submit">Começar o quiz →</button>
      </form>
    </section>

    <!-- Pergunta -->
    <section class="screen" id="s-q">
      <div class="prog">
        <div class="prog-meta"><span>Pergunta <b id="p-n">1</b> de <span id="p-t">10</span></span><span id="p-pct">0%</span></div>
        <div class="bar"><i id="p-bar" style="width:0"></i></div>
      </div>
      <div class="q-num" id="q-num">Pergunta 1</div>
      <div class="q-text" id="q-text"></div>
      <div class="opts" id="q-opts" role="radiogroup"></div>
      <div class="nav">
        <button class="btn btn-g" id="b-back" type="button">← Voltar</button>
        <button class="btn btn-p" id="b-next" type="button" disabled>Próxima →</button>
      </div>
    </section>

    <!-- Enviando -->
    <section class="screen" id="s-load">
      <div class="loader"><div class="spin"></div><p>Corrigindo suas respostas…</p></div>
    </section>

    <!-- Resultado -->
    <section class="screen" id="s-res">
      <div id="res-body"></div>
    </section>

    <section class="screen" id="s-404">
      <div class="notfound"><span class="badge">Quiz</span><h1>Quiz não encontrado</h1><p>Confira o link que você recebeu na plataforma.</p></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- obrigatório para a Cademí exibir a página incorporada (ajusta a altura do iframe) -->
<script src="https://core.cademi.com.br/assets/js/vendor/iframeResizer.contentWindow.min.js"></script>
<script>
/* ================== CONFIG ================== */
const CONFIG = {
  // URL do Web App do Apps Script da planilha "Respostas Quiz Intensivão Saia do Básico"
  sheetUrl: 'https://script.google.com/macros/s/AKfycbwfUtAyshJ0h7EP4qOLhDidPj0As8jJZVAXhfrH4u1N5SVK8kuGgq5XhCiTi1J_mMxqYQ/exec',
  curso: 'Intensivão Saia do Básico'
};

/* Cada quiz: título + perguntas. "c" = índice (0, 1, 2…) da alternativa correta. */
const QUIZZES = {
  1: {
    titulo: 'Quiz 1',
    perguntas: [
      { q: 'Qual a melhor resposta para "What\'s up?"', o: ["I'm fine thanks, and you?", "I'm working a lot", 'No, thanks'], c: 1, e: "\"What's up?\" é um \"E aí?\" informal, que pergunta o que está acontecendo com você. Por isso a resposta natural conta o que você anda fazendo: \"I'm working a lot\". \"I'm fine, thanks\" responde a \"How are you?\", e \"No, thanks\" é para recusar uma oferta." },
      { q: 'Como dizer: "Eles vão estar em SP semana que vem"', o: ["They'll be in SP next week", 'They are in SP next week', 'They were in SP next week'], c: 0, e: "\"Vão estar\" fala do futuro, e o futuro de to be é will be (contraído: they'll be). \"They are\" é presente e \"they were\" é passado, e nenhum dos dois combina com \"next week\"." },
      { q: 'Como dizer: "Nós estávamos de férias em Cancún."', o: ['We are on vacation in Cancun.', 'We will be on vacation in Cancun.', 'We were on vacation in Cancun.'], c: 2, e: "\"Estávamos\" é passado. O passado de to be com we é were: \"We were on vacation\". \"We are\" é presente e \"we will be\" é futuro." },
      { q: 'Qual destas alternativas está correta?', o: ['An engineer, a eraser, a donut', 'An engineer, an apple, a donut', 'An engineers, an apples, a donuts'], c: 1, e: "Usamos an antes de som de vogal (an engineer, an apple, an eraser) e a antes de som de consoante (a donut). Por isso \"a eraser\" está errado. E a/an só vão com uma coisa (singular): \"an engineers\" e \"an apples\" não existem." },
      { q: 'Qual dessas frases está correta?', o: ['We love the Canada', "She's one years old", "They're teachers"], c: 2, e: "\"They're teachers\" está certo: they are + profissão no plural. Nas outras: a maioria dos países vem sem \"the\" (We love Canada), e com \"one\" a palavra fica no singular (She's one year old)." },
      { q: "Complete a frase: I'll be here ___", o: ['Yesterday', 'Last week', 'Tomorrow'], c: 2, e: "\"I'll be\" fala do futuro, então pede uma expressão de futuro: tomorrow (amanhã). \"Yesterday\" (ontem) e \"last week\" (semana passada) são passado." },
      { q: 'Complete corretamente: Paul ___ a teacher. He ___ working last night. Tomorrow he ___ with his family', o: ['was / was / is', 'is / was / will be', 'are / were / will be'], c: 1, e: "Paul é \"he\", então o to be dele é is (presente), was (passado, por causa do \"last night\") e will be (futuro, por causa do \"tomorrow\"). \"Are\" e \"were\" são para you, we e they." },
      { q: 'Como se diz: "Ouvi falar muito sobre você"', o: ["I've heard a lot about you.", 'I listen a lot of you', 'I know a lot about of you'], c: 0, e: "\"Ouvir falar sobre\" em inglês é hear about, e \"já ouvi\" fica \"I've heard\". \"Listen\" é escutar com atenção (música, alguém falando), e \"about of\" não existe." },
      { q: 'Como se diz: "Eu acho que conheço você"', o: ['I think I meet you.', 'I guess I knew you.', 'I think I know you.'], c: 2, e: "Para \"conhecer\" alguém no presente usamos know: \"I think I know you\". \"Meet\" é conhecer pela primeira vez (ser apresentado), e \"knew\" é passado." },
      { q: 'Como ficaria na interrogativa: "It is amazing."', o: ['Is it amazing?', 'It is amazing?', 'Does it amazing?'], c: 0, e: "Para fazer pergunta com to be, é só trocar a ordem: o verbo vem antes do sujeito, \"Is it amazing?\". \"Does\" não se usa com to be, e \"It is amazing?\" sem inverter a ordem não é a forma da pergunta." }
    ]
  }
};

/* ================== APP ================== */
const $ = id => document.getElementById(id);
const LETRAS = 'ABCDEFGH';
const params = new URLSearchParams(location.search);
const quizId = params.get('quiz') || '1';
const QUIZ = QUIZZES[quizId];
const state = { nome: '', email: '', whatsapp: '', i: 0, resp: [] };

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  irParaTopo();
  avisarAltura();
}
function irParaTopo() {
  // Dentro da Cademí o iframe cresce com o conteúdo, então quem rola é a página da Cademí.
  // Só rola se o topo do quiz saiu da tela, e para um pouco acima por causa da faixa fixa da Cademí.
  const pf = window.parentIFrame;
  if (pf && pf.getPageInfo) {
    let feito = false;
    try {
      pf.getPageInfo(info => {
        if (feito) return;
        feito = true;
        try { pf.getPageInfo(false); } catch (e) {}
        if (info.offsetTop - info.scrollTop < 0) pf.scrollTo(0, Math.max(0, info.offsetTop - 170));
      });
      return;
    } catch (e) {}
  }
  if (window.scrollY > 0) window.scrollTo({ top: 0, behavior: 'smooth' });
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }

/* Avisa a altura ao site-pai (iframe), para quem quiser ajustar automaticamente */
function avisarAltura() {
  requestAnimationFrame(() => {
    try { parent.postMessage({ tipo: 'quiz-altura', altura: document.documentElement.scrollHeight }, '*'); } catch (e) {}
  });
}
window.addEventListener('resize', avisarAltura);

/* ---------- capa ---------- */
function iniciar() {
  if (!QUIZ) { show('s-404'); return; }
  document.title = `${QUIZ.titulo} — ${CONFIG.curso}`;
  $('h-badge').textContent = QUIZ.titulo;
  $('h-count').textContent = `${QUIZ.perguntas.length} perguntas`;
  state.resp = new Array(QUIZ.perguntas.length).fill(null);
  try {
    const salvo = JSON.parse(localStorage.getItem('quiz-intensivao-aluna') || 'null');
    if (salvo) { $('i-nome').value = salvo.nome || ''; $('i-email').value = salvo.email || ''; $('i-whats').value = salvo.whatsapp || ''; }
  } catch (e) {}
  // a Cademí manda os dados da aluna logada na URL (cuser_name, cuser_email, cuser_phone)
  const cad = { 'i-nome': params.get('cuser_name'), 'i-email': params.get('cuser_email'), 'i-whats': params.get('cuser_phone') };
  Object.entries(cad).forEach(([id, v]) => { if (v && v.trim()) $(id).value = v.trim(); });
  if (cad['i-whats']) $('i-whats').dispatchEvent(new Event('input'));
  show('s-start');
}

$('i-whats').addEventListener('input', e => {
  let d = e.target.value.replace(/\D/g, '').slice(0, 13);
  if (d.length > 11 && d.startsWith('55')) d = d.slice(2); // DDI do Brasil
  if (d.length > 11) { e.target.value = '+' + d; return; } // número com DDI
  if (d.length > 6) e.target.value = `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}`;
  else if (d.length > 2) e.target.value = `(${d.slice(0, 2)}) ${d.slice(2)}`;
  else e.target.value = d;
});

$('f-start').addEventListener('submit', e => {
  e.preventDefault();
  const nome = $('i-nome').value.trim(), email = $('i-email').value.trim(), whats = $('i-whats').value.trim();
  const erros = [];
  ['i-nome', 'i-email', 'i-whats'].forEach(id => $(id).classList.remove('bad'));
  if (nome.split(/\s+/).length < 2 || nome.length < 4) { erros.push('Digite seu nome completo.'); $('i-nome').classList.add('bad'); }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { erros.push('Confira seu e-mail.'); $('i-email').classList.add('bad'); }
  if (whats.replace(/\D/g, '').length < 10) { erros.push('Confira seu WhatsApp com DDD.'); $('i-whats').classList.add('bad'); }
  $('e-start').textContent = erros[0] || '';
  if (erros.length) return;
  Object.assign(state, { nome, email: email.toLowerCase(), whatsapp: whats, i: 0 });
  try { localStorage.setItem('quiz-intensivao-aluna', JSON.stringify({ nome, email, whatsapp: whats })); } catch (e) {}
  renderPergunta();
  show('s-q');
});

/* ---------- perguntas ---------- */
function renderPergunta() {
  const n = QUIZ.perguntas.length, p = QUIZ.perguntas[state.i];
  $('p-n').textContent = state.i + 1; $('p-t').textContent = n;
  const pct = Math.round(state.i / n * 100);
  $('p-pct').textContent = pct + '%'; $('p-bar').style.width = pct + '%';
  $('q-num').textContent = `Pergunta ${state.i + 1}`;
  $('q-text').textContent = p.q;
  $('q-opts').innerHTML = p.o.map((t, k) =>
    `<button type="button" role="radio" class="opt${state.resp[state.i] === k ? ' sel' : ''}" data-k="${k}" aria-checked="${state.resp[state.i] === k}"><span class="l">${LETRAS[k]}</span><span>${esc(t)}</span></button>`
  ).join('');
  $('b-back').disabled = state.i === 0;
  $('b-next').disabled = state.resp[state.i] === null;
  $('b-next').textContent = state.i === n - 1 ? 'Ver meu resultado ✓' : 'Próxima →';
  avisarAltura();
}

$('q-opts').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if (!b) return;
  state.resp[state.i] = Number(b.dataset.k);
  document.querySelectorAll('.opt').forEach(o => { const on = o === b; o.classList.toggle('sel', on); o.setAttribute('aria-checked', on); });
  $('b-next').disabled = false;
});
$('b-back').addEventListener('click', () => { if (state.i > 0) { state.i--; renderPergunta(); } });
$('b-next').addEventListener('click', () => {
  if (state.resp[state.i] === null) return;
  if (state.i < QUIZ.perguntas.length - 1) { state.i++; renderPergunta(); irParaTopo(); }
  else finalizar();
});

/* ---------- envio e resultado ---------- */
function corrigir() {
  const itens = QUIZ.perguntas.map((p, k) => ({
    q: p.q, sua: p.o[state.resp[k]], certa: p.o[p.c], ok: state.resp[k] === p.c, exp: p.e || ''
  }));
  const acertos = itens.filter(x => x.ok).length;
  return { itens, acertos, total: itens.length, nota: Math.round(acertos / itens.length * 100) };
}

async function enviar(r) {
  if (!CONFIG.sheetUrl) { console.warn('CONFIG.sheetUrl vazio: resposta não enviada.'); return false; }
  const payload = {
    quiz: QUIZ.titulo,
    cabecalho: QUIZ.perguntas.map((p, k) => `${k + 1}. ${p.q}`),
    nome: state.nome, email: state.email, whatsapp: state.whatsapp,
    respostas: r.itens.map(x => x.sua),
    acertos: `${r.acertos}/${r.total}`, nota: r.nota
  };
  for (let t = 0; t < 3; t++) {
    try {
      const res = await fetch(CONFIG.sheetUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
      const j = await res.json();
      if (j.ok) return true;
    } catch (e) { console.warn('Falha ao enviar (tentativa ' + (t + 1) + ')', e); }
    await new Promise(ok => setTimeout(ok, 1200 * (t + 1)));
  }
  return false;
}

let RESULTADO = null;
async function finalizar() {
  show('s-load');
  RESULTADO = corrigir();
  const espera = new Promise(ok => setTimeout(ok, 900));
  const [enviado] = await Promise.all([enviar(RESULTADO), espera]);
  RESULTADO.enviado = enviado;
  renderResultado(RESULTADO);
  show('s-res');
}

function mensagem(nota) {
  if (nota === 100) return ['Perfeito', 'Você acertou tudo! Continue nesse ritmo.'];
  if (nota >= 80) return ['Muito bem', 'Excelente resultado! Revise os pontos abaixo e siga em frente.'];
  if (nota >= 60) return ['Bom trabalho', 'Você está no caminho. Revise as correções para fixar.'];
  return ['Continue praticando', 'Errar faz parte do aprendizado. Revise as correções com calma.'];
}

function renderResultado(r) {
  const [tit, txt] = mensagem(r.nota);
  const primeiro = state.nome.split(/\s+/)[0];
  const C = 2 * Math.PI * 64, off = C * (1 - r.nota / 100);
  const data = new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  $('res-body').innerHTML = `
    <div class="res-head">
      <span class="badge">${esc(QUIZ.titulo)} · ${esc(CONFIG.curso)}</span>
      <h2>${esc(tit)}, <em>${esc(primeiro)}!</em></h2>
      <p>${esc(txt)}</p>
      <div class="score">
        <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="#f4f4f5" stroke-width="12"/>
        <circle id="ring" cx="75" cy="75" r="64" fill="none" stroke="#f2133b" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.1s ease"/></svg>
        <div class="n"><b>${r.nota}</b><span>de 100 pontos</span></div>
      </div>
      <div class="stats"><span class="stat ok">✓ ${r.acertos} acerto${r.acertos === 1 ? '' : 's'}</span><span class="stat no">✗ ${r.total - r.acertos} erro${r.total - r.acertos === 1 ? '' : 's'}</span></div>
      <p class="who pdf-only">${esc(state.nome)} · ${esc(state.email)} · ${esc(data)}</p>
    </div>
    <div class="actions">
      <button class="btn btn-o" id="b-copy" type="button">📋 Copiar tudo</button>
      <button class="btn btn-p" id="b-pdf" type="button">⬇ Baixar PDF</button>
    </div>
    <div class="sec-t">Correção</div>
    ${r.itens.map((x, k) => `
      <div class="rev ${x.ok ? 'ok' : 'no'}">
        <div class="rev-top"><span class="rev-ic">${x.ok ? '✓' : '✗'}</span><div class="rev-q">${k + 1}. ${esc(x.q)}</div></div>
        <div class="rev-a ${x.ok ? 'right' : 'wrong'}"><small>Sua resposta</small><b>${esc(x.sua)}</b></div>
        ${x.ok ? '' : `<div class="rev-a right"><small>Resposta certa</small><b>${esc(x.certa)}</b></div>`}
        ${!x.ok && x.exp ? `<div class="rev-exp"><strong>Por quê?</strong>${esc(x.exp)}</div>` : ''}
      </div>`).join('')}
    <button class="btn btn-o full no-print" id="b-redo" type="button" style="margin-top:10px">↻ Refazer o quiz</button>`;
  requestAnimationFrame(() => setTimeout(() => { const ring = $('ring'); if (ring) ring.style.strokeDashoffset = off; }, 60));
  $('b-copy').onclick = copiar;
  $('b-pdf').onclick = baixarPdf;
  $('b-redo').onclick = () => { state.resp = new Array(QUIZ.perguntas.length).fill(null); state.i = 0; renderPergunta(); show('s-q'); };
}

function textoResultado(r) {
  const linhas = [
    `${QUIZ.titulo} — ${CONFIG.curso}`,
    `Nome: ${state.nome}`,
    `Data: ${new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}`,
    `Nota: ${r.nota}/100 (${r.acertos} de ${r.total} acertos)`,
    ''
  ];
  r.itens.forEach((x, k) => {
    linhas.push(`${k + 1}. ${x.q}`);
    linhas.push(`   Sua resposta: ${x.sua} ${x.ok ? '✓' : '✗'}`);
    if (!x.ok) linhas.push(`   Resposta certa: ${x.certa}`);
    if (!x.ok && x.exp) linhas.push(`   Por quê? ${x.exp}`);
    linhas.push('');
  });
  return linhas.join('\n').trim();
}

async function copiar() {
  const txt = textoResultado(RESULTADO);
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {}
  if (!ok) { // iframe sem permissão de área de transferência
    const ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }
  toast(ok ? 'Resultado copiado! ✓' : 'Não foi possível copiar automaticamente.');
}

function carregarScript(src) {
  return new Promise((ok, falha) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = falha; document.head.appendChild(s); });
}

async function baixarPdf() {
  const b = $('b-pdf'); const rot = b.textContent;
  b.disabled = true; b.textContent = 'Gerando PDF…';
  const card = $('card');
  try {
    if (!window.html2pdf) await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
    card.classList.add('pdf-mode');
    const ring = $('ring'); if (ring) { ring.style.transition = 'none'; }
    const nomeArq = `${QUIZ.titulo} - ${state.nome}`.replace(/[\\/:*?"<>|]/g, '') + '.pdf';
    await html2pdf().set({
      margin: [10, 10, 12, 10], filename: nomeArq,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'avoid-all'] }
    }).from($('s-res')).save();
    toast('PDF baixado ✓');
  } catch (e) {
    console.warn('PDF direto falhou, abrindo impressão', e);
    toast('Escolha "Salvar como PDF" na janela de impressão.');
    setTimeout(() => window.print(), 400);
  } finally {
    card.classList.remove('pdf-mode');
    b.disabled = false; b.textContent = rot;
  }
}

iniciar();
</script>
</body>
</html>
